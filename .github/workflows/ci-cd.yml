# =============================================================================
# CI/CD Pipeline — Retail Store Sample App
# =============================================================================
#
# Flow:
#   push to main
#     └─ detect-changes
#          └─ build-and-push
#               ├─ Docker build
#               ├─ Push image to Amazon ECR
#               ├─ Update Helm values.yaml
#               └─ Commit + push [skip ci]
#                    └─ ArgoCD auto-syncs → EKS
#
# AWS Authentication:
#   GitHub Actions -> AWS Access Key -> IAM User -> ECR
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID
#
# Required GitHub Variable:
#   AWS_REGION
# =============================================================================

name: CI/CD — Build, Push & Deploy

on:
  push:
    branches:
      - main
    paths:
      - "src/ui/**"
      - "src/catalog/**"
      - "src/cart/**"
      - "src/orders/**"
      - "src/checkout/**"

  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to force-rebuild (e.g. ui,catalog). Leave empty to auto-detect."
        required: false
        default: ""

# GITHUB_TOKEN permissions.
#
# contents: write
#   Allows the workflow to update Helm values.yaml and push the commit
#   back to the repository.
#
# No id-token permission is required because AWS OIDC is NOT being used.
permissions:
  contents: write

# Prevent concurrent runs on the same branch from racing while updating
# Helm values.yaml.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  # Example:
  # 123456789012.dkr.ecr.us-west-2.amazonaws.com
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

# =============================================================================
# JOB 1 — DETECT CHANGES
# =============================================================================

jobs:

  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      ui: ${{ steps.filter.outputs.ui }}
      catalog: ${{ steps.filter.outputs.catalog }}
      cart: ${{ steps.filter.outputs.cart }}
      orders: ${{ steps.filter.outputs.orders }}
      checkout: ${{ steps.filter.outputs.checkout }}
      services: ${{ steps.build-matrix.outputs.services }}

    steps:

      # -----------------------------------------------------------------------
      # Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Detect which service directories changed
      # -----------------------------------------------------------------------
      - name: Detect which services changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'src/ui/**'

            catalog:
              - 'src/catalog/**'

            cart:
              - 'src/cart/**'

            orders:
              - 'src/orders/**'

            checkout:
              - 'src/checkout/**'

      # -----------------------------------------------------------------------
      # Build service matrix
      # -----------------------------------------------------------------------
      - name: Build service matrix
        id: build-matrix
        shell: bash
        run: |
          MANUAL="${{ github.event.inputs.services }}"

          if [[ -n "$MANUAL" ]]; then

            SERVICES=$(python3 -c "
          import json, os
          raw = os.environ.get('MANUAL_INPUT', '')
          items = [s.strip() for s in raw.split(',') if s.strip()]
          print(json.dumps(items))
          " MANUAL_INPUT="$MANUAL")

          else

            SERVICES="[]"

            for svc in ui catalog cart orders checkout; do

              val=$(echo '${{ toJSON(steps.filter.outputs) }}' | \
                python3 -c \
                "import sys,json; d=json.load(sys.stdin); print(d.get('$svc','false'))")

              if [[ "$val" == "true" ]]; then

                SERVICES=$(echo "$SERVICES" | python3 -c \
                  "import sys,json; l=json.load(sys.stdin); l.append('$svc'); print(json.dumps(l))")

              fi

            done

          fi

          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

          echo "Services to build: $SERVICES"


# =============================================================================
# JOB 2 — BUILD, PUSH & UPDATE HELM VALUES
# =============================================================================

  build-and-push:
    name: Build & push — ${{ matrix.service }}

    runs-on: ubuntu-latest

    needs: detect-changes

    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    steps:

      # -----------------------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Configure AWS credentials
      #
      # IMPORTANT:
      # OIDC has been removed.
      #
      # GitHub Actions now authenticates using:
      #
      # GitHub Secrets
      #       ↓
      # AWS Access Key
      #       ↓
      # IAM User
      #       ↓
      # ECR
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # -----------------------------------------------------------------------
      # 3. Login to Amazon ECR
      # -----------------------------------------------------------------------
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # -----------------------------------------------------------------------
      # 4. Compute image tag
      #
      # Example:
      # sha-abc123456789...
      # -----------------------------------------------------------------------
      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          echo "Image tag: ${IMAGE_TAG}"

      # -----------------------------------------------------------------------
      # 5. Build Docker image
      # -----------------------------------------------------------------------
      - name: Build Docker image
        shell: bash
        run: |
          IMAGE="${ECR_REGISTRY}/retail-store-${{ matrix.service }}:${IMAGE_TAG}"

          echo "Building image:"
          echo "${IMAGE}"

          docker build \
            -t "${IMAGE}" \
            "src/${{ matrix.service }}"

      # -----------------------------------------------------------------------
      # 6. Push Docker image to ECR
      # -----------------------------------------------------------------------
      - name: Push Docker image to ECR
        shell: bash
        run: |
          IMAGE="${ECR_REGISTRY}/retail-store-${{ matrix.service }}:${IMAGE_TAG}"

          echo "Pushing image:"
          echo "${IMAGE}"

          docker push "${IMAGE}"

      # -----------------------------------------------------------------------
      # 7. Update Helm values.yaml
      #
      # Updates:
      #
      # image.repository
      # image.tag
      # -----------------------------------------------------------------------
      - name: Update Helm image
        shell: bash
        run: |
          VALUES_FILE="src/${{ matrix.service }}/chart/values.yaml"

          ECR_REPOSITORY="${ECR_REGISTRY}/retail-store-${{ matrix.service }}"

          echo "Updating:"
          echo "${VALUES_FILE}"

          echo "Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Tag:"
          echo "${IMAGE_TAG}"

          python3 - <<PY
          from pathlib import Path
          import re

          path = Path("${VALUES_FILE}")

          content = path.read_text()

          repository = "${ECR_REPOSITORY}"
          tag = "${IMAGE_TAG}"

          content = re.sub(
              r'(^\s*repository:\s*).*$',
              r'\1' + repository,
              content,
              flags=re.MULTILINE
          )

          content = re.sub(
              r'(^\s*tag:\s*).*$',
              r'\1' + tag,
              content,
              flags=re.MULTILINE
          )

          path.write_text(content)
          PY

          echo "Updated values.yaml:"
          cat "${VALUES_FILE}"

      # -----------------------------------------------------------------------
      # 8. Commit updated Helm values
      # -----------------------------------------------------------------------
      - name: Commit Helm image update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "src/${{ matrix.service }}/chart/values.yaml"

          if git diff --cached --quiet; then
            echo "No Helm values changes detected."
            exit 0
          fi

          git commit -m \
            "ci: update ${{ matrix.service }} image to ${IMAGE_TAG} [skip ci]"

      # -----------------------------------------------------------------------
      # 9. Push Helm update back to main
      # -----------------------------------------------------------------------
      - name: Push Helm update
        shell: bash
        run: |
          git push origin HEAD:main


# =============================================================================
# END
# =============================================================================